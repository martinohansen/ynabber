name: Go

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out -v ./... | tee test-output.txt

      - name: Report coverage
        run: |
          coverage_total="$(go tool cover -func=coverage.out | awk 'END {print $NF}')"
          go tool cover -html=coverage.out -o coverage.html

          {
            echo "### Test coverage"
            echo
            echo "**Total statement coverage: ${coverage_total}**"
            echo
            echo "| Package | Coverage |"
            echo "| --- | ---: |"
            awk '
              /coverage:/ {
                package_name = ($1 == "ok" ? $2 : $1)
                coverage = $0
                sub(/^.*coverage: /, "", coverage)
                sub(/ .*/, "", coverage)
                sub(/^github.com\/martinohansen\/ynabber\/?/, "", package_name)
                if (package_name == "") {
                  package_name = "(root)"
                }
                printf "| `%s` | %s |\n", package_name, coverage
              }
            ' test-output.txt | sort
            echo
            echo "Download the \`coverage-report\` artifact for the HTML report and raw Go profile."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.out
          retention-days: 7

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          OS_ARCH="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            OS_ARCH="${OS_ARCH}-v${{ matrix.goarm }}"
          fi
          BINARY_NAME="ynabber-${OS_ARCH}"
          go build -o "$BINARY_NAME" ./cmd/ynabber/

          echo "binary=$BINARY_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build.outputs.binary }}
          path: ${{ steps.build.outputs.binary }}
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build, test, vuln]
    if: github.ref_type == 'tag' && github.repository == 'martinohansen/ynabber'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/ynabber-*
